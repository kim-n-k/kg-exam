<html>
    <head>
        <title>Register</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/auth.css}">
        <link rel="stylesheet" th:href="@{/css/common.css}">
        <script defer th:src="@{/js/language.js}"></script>
    </head>
    <body>

        <!-- Header -->
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- REGISTER SECTION -->
        <main class="auth-container">

            <div class="auth-card">

                <!-- TITLE -->
                <div class="auth-heading">

                    <h1 th:text="#{register.title}">
                        Create Your Account
                    </h1>

                    <p th:text="#{register.description}">
                        Join Kaigo Exam and start learning today.
                    </p>

                </div>


                <!-- REGISTER FORM -->
                <form th:action="@{/register}"
                      method="post"
                      class="auth-form">


                    <!-- FULL NAME -->
                    <div class="form-group">

                        <label for="fullName"
                               th:text="#{register.fullname}">
                            Full Name
                        </label>

                        <input type="text"
                               id="fullName"
                               name="fullName"
                               autocomplete="name"
                               required>

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email"
                               th:text="#{register.email}">
                            Email Address
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="example@email.com"
                               autocomplete="email"
                               required>

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password"
                               th:text="#{register.password}">
                            Password
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               autocomplete="new-password"
                               minlength="8"
                               required>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label for="confirmPassword"
                               th:text="#{register.confirm.password}">
                            Confirm Password
                        </label>

                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               autocomplete="new-password"
                               minlength="8"
                               required>

                    </div>


                    <!-- REGISTER BUTTON -->
                    <button type="submit"
                            class="auth-submit"
                            th:text="#{register.button}">
                        Sign Up
                    </button>

                </form>


                <!-- LOGIN LINK -->
                <div class="auth-footer">

                    <span th:text="#{register.have.account}">
                        Already have an account?
                    </span>

                    <a th:href="@{/login}"
                       th:text="#{register.signin}">
                        Sign In
                    </a>

                </div>

            </div>

        </main>


        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
