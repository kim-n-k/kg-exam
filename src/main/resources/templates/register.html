<html>
    <head>
        <title>Register</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/auth.css}">
        <script defer th:src="@{/js/language.js}"></script>
    </head>
    <body>

        <header class="header">

            <a href="/" class="logo">
                <span>介護</span>
                <strong>Kaigo Exam</strong>
            </a>

            <div class="header-right">

                <select id="languageSelect" class="language-select">
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="vi">🇻🇳 Tiếng Việt</option>
                    <option value="en">🇬🇧 English</option>
                </select>

                <a href="/" class="home-link" data-i18n="home">
                    Home
                </a>

            </div>

        </header>


        <main class="auth-container">

            <div class="auth-card">

                <div class="auth-logo">介護</div>

                <h1 data-i18n="registerTitle">
                    Create Your Account
                </h1>

                <p class="description"
                   data-i18n="registerDescription">
                    Join Kaigo Exam and start learning today.
                </p>

                <form action="/register" method="post">

                    <div class="form-group">
                        <label data-i18n="fullName">Full Name</label>

                        <input type="text"
                               name="fullName"
                               required>
                    </div>

                    <div class="form-group">
                        <label data-i18n="email">Email Address</label>

                        <input type="email"
                               name="email"
                               required>
                    </div>

                    <div class="form-group">
                        <label data-i18n="password">Password</label>

                        <input type="password"
                               name="password"
                               required>
                    </div>

                    <div class="form-group">
                        <label data-i18n="confirmPassword">
                            Confirm Password
                        </label>

                        <input type="password"
                               name="confirmPassword"
                               required>
                    </div>

                    <button type="submit" class="btn-primary"
                            data-i18n="signUp">
                        Sign Up
                    </button>

                </form>

                <div class="auth-footer">

                    <span data-i18n="alreadyAccount">
                        Already have an account?
                    </span>

                    <a href="/login" data-i18n="signIn">
                        Sign In
                    </a>

                </div>

            </div>

        </main>

        <footer>
            © 2026 Kaigo Exam System
        </footer>
    </body>
</html>
