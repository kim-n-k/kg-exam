<html>
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/auth.css}">
        <link rel="stylesheet" th:href="@{/css/common.css}">
        <script defer th:src="@{/js/language.js}"></script>

    </head>
    <body>

        <!-- Header -->
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- LOGIN SECTION -->
        <main class="auth-container">

            <div class="auth-card">

                <!-- TITLE -->
                <div class="auth-heading">

                    <h1 th:text="#{login.title}">
                        Welcome Back
                    </h1>

                    <p th:text="#{login.description}">
                        Sign in to continue your learning journey.
                    </p>

                </div>


                <!-- LOGIN FORM -->
                <form th:action="@{/login}"
                      method="post"
                      class="auth-form">

                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email"
                               th:text="#{login.email}">
                            Email Address
                        </label>

                        <input type="email"
                               id="email"
                               name="username"
                               placeholder="example@email.com"
                               autocomplete="username"
                               required>

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password"
                               th:text="#{login.password}">
                            Password
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               autocomplete="current-password"
                               required>

                    </div>


                    <!-- REMEMBER / FORGOT -->
                    <div class="login-options">

                        <label class="remember-option">

                            <input type="checkbox"
                                   name="remember-me">

                            <span th:text="#{login.remember}">
                                Remember me
                            </span>

                        </label>

                        <a th:href="@{/forgot-password}"
                           class="forgot-link"
                           th:text="#{login.forgot}">
                            Forgot password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button type="submit"
                            class="auth-submit"
                            th:text="#{login.button}">
                        Sign In
                    </button>

                </form>


                <!-- REGISTER LINK -->
                <div class="auth-footer">

                    <span th:text="#{login.no.account}">
                        Don't have an account?
                    </span>

                    <a th:href="@{/register}"
                       th:text="#{login.create.account}">
                        Create Account
                    </a>
                </div>
            </div>
        </main>
        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
