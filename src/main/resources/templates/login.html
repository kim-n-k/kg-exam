<html>
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/auth.css}">
        <script defer th:src="@{/js/language.js}"></script>

    </head>
    <body>

        <header class="header">

            <a href="/" class="logo">
                <span>介護</span>
                <strong>Kaigo Exam</strong>
            </a>

            <div class="header-right">

                <select id="languageSelect" class="language-select">
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="vi">🇻🇳 Tiếng Việt</option>
                    <option value="en">🇬🇧 English</option>
                </select>

                <a href="/" class="home-link" data-i18n="home">
                    Home
                </a>

            </div>
        </header>


        <main class="auth-container">

            <div class="auth-card">

                <div class="auth-logo">介護</div>

                <h1 data-i18n="loginTitle">Welcome Back</h1>

                <p class="description"
                   data-i18n="loginDescription">
                    Sign in to continue your learning journey.
                </p>

                <form action="/login" method="post">

                    <div class="form-group">
                        <label data-i18n="email">Email Address</label>

                        <input type="email"
                               name="email"
                               placeholder="example@email.com"
                               required>
                    </div>

                    <div class="form-group">
                        <label data-i18n="password">Password</label>

                        <input type="password"
                               name="password"
                               required>
                    </div>

                    <div class="form-options">

                        <label class="remember">
                            <input type="checkbox" name="remember">
                            <span data-i18n="remember">
                                Remember me
                            </span>
                        </label>

                        <a href="#" data-i18n="forgot">
                            Forgot password?
                        </a>

                    </div>

                    <button type="submit" class="btn-primary"
                            data-i18n="signIn">
                        Sign In
                    </button>

                </form>

                <div class="auth-footer">

                    <span data-i18n="noAccount">
                        Don't have an account?
                    </span>

                    <a href="/register" data-i18n="createAccount">
                        Create Account
                    </a>

                </div>

            </div>

        </main>

        <footer>
            © 2026 Kaigo Exam System
        </footer>
    </body>
</html>
