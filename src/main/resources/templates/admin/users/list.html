<html>
    <head>
        <title>User Management</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f6fa;
        }

        h1 {
            color: #263238;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #263b59;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .student {
            color: green;
            font-weight: bold;
        }

        .admin {
            color: blue;
            font-weight: bold;
        }
    </style>
    </head>
    <body>
         <h1>User Management</h1>

    <p>
        Total Users:
        <strong th:text="${#lists.size(users)}">0</strong>
    </p>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Registered Date</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="user : ${users}">

                <td th:text="${user.id}"></td>

                <td th:text="${user.fullName}"></td>

                <td th:text="${user.email}"></td>

                <td>
                    <span th:text="${user.role}"
                          th:class="${user.role == 'ADMIN'}
                          ? 'admin' : 'student'">
                    </span>
                </td>

                <td th:text="${user.createdAt}"></td>

            </tr>

            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="5">
                    No registered users.
                </td>
            </tr>

        </tbody>

    </table>
    </body>
</html>
