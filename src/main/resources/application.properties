spring.application.name=exam

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Kh\u00f4ng cache HTML template
spring.thymeleaf.cache=false

# Kh\u00f4ng cache static resources
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# B\u1eadt DevTools restart
spring.devtools.restart.enabled=true

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/kaigo_exam
spring.datasource.username=kaigo
spring.datasource.password=kaigo

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
spring.jpa.show-sql=true

# Format SQL
spring.jpa.properties.hibernate.format_sql=true
